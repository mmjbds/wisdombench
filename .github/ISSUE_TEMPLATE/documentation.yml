name: Documentation correction
description: Report an inaccurate, ambiguous, stale, or broken public explanation.
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: Public location
      description: File path, section, or URL.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: State what is wrong, the evidence, and the bounded replacement.
    validations:
      required: true
