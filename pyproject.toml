[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wisdombench"
version = "0.1.0"
description = "Minimal public scorer for longitudinal learning-from-failure evaluation."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

